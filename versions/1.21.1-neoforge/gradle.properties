# Node: Minecraft 1.21.1 / NeoForge (built with ModStitch + ModDevGradle)
modstitch.platform=moddevgradle

deps.minecraft=1.21.1
deps.neoforge=21.1.235

# Metadata expanded into META-INF/neoforge.mods.toml and pack.mcmeta
vers.packFormat=34
vers.loaderRange=[4,)
vers.loaderDepRange=[21.1,)
vers.minecraftRange=[1.21.1,1.21.2)

# JEI: compile against the API, run the full mod in dev.
# 19.39.0.372 is the newest JEI that accepts NeoForge 21.1.235 (19.42+ requires 21.1.238+).
deps.jei=19.39.0.372
# Patchouli: compile against the API, run the full mod in dev
deps.patchouli=1.21.1-93-NEOFORGE

# Mods on the compile + dev runtime classpath (one coordinate per deps.mod.* key).
# CoFH Core / Thermal have no 1.21.1 NeoForge release, so they are absent on this node.
deps.mod.farmersdelight=curse.maven:farmers-delight-398521:8765184
deps.mod.pneumaticcraft=curse.maven:pneumaticcraft-repressurized-281849:9363728
