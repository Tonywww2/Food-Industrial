# Node: Minecraft 1.21.1 / NeoForge (built with ModStitch + ModDevGradle)
modstitch.platform=moddevgradle

deps.minecraft=1.21.1
deps.neoforge=21.1.235

# Metadata expanded into META-INF/neoforge.mods.toml and pack.mcmeta
vers.packFormat=34
vers.loaderRange=[4,)
vers.loaderDepRange=[21.1,)
vers.minecraftRange=[1.21.1,1.21.2)

# JEI: compile against the API, run the full mod in dev.
# 19.39.0.372 is the newest JEI that accepts NeoForge 21.1.235 (19.42+ requires 21.1.238+).
deps.jei=19.39.0.372
# Patchouli: compile against the API, run the full mod in dev
deps.patchouli=1.21.1-93-NEOFORGE

# Mods on the compile + dev runtime classpath (one coordinate per deps.mod.* key).
# CoFH Core / Thermal have no 1.21.1 NeoForge release, so they are absent on this node.
deps.mod.farmersdelight=curse.maven:farmers-delight-398521:8765184
deps.mod.pneumaticcraft=curse.maven:pneumaticcraft-repressurized-281849:9363728

# Dev runtime only (2026-11-11, user): mods that fill material tags no other dependency fills, so the
# recipes using them show in JEI. Pam's HarvestCraft 2 Crops and Trees (pamhc2crops/trees NeoForge 1.21.1-1.0.9): corn, soybean, tea,
# grape, pineapple, papaya, citrus, cinnamon.
deps.dev.pamhc2crops=curse.maven:pams-harvestcraft-2-crops-361385:8064883
deps.dev.pamhc2trees=curse.maven:pams-harvestcraft-2-trees-365460:7847533

# Optional mods (I24–I27, 2026-11-11): compiled against, in the dev runtime only with -PfiWith=<name>,… or all.
# Create, Mekanism: I25 integration recipes; Create also the transmission interface.
deps.opt.create=maven.modrinth:LNytGWDc:UjX6dr61
deps.opt.mekanism=maven.modrinth:Ce6I4WUE:5KzzycBT
# GTCEu 7.0.2 (I26): its materials fill the common tags of this mod's metals and chemicals.
deps.opt.gtceu=maven.modrinth:gregtechceu-modern:iFPVZs0V
# AE2 (I24): pattern providers on the machines; GuideME is its required library.
deps.opt.ae2=maven.modrinth:XxWD5pD3:DxZ2waV0
deps.opt.guideme=maven.modrinth:Ck4E7v7R:QeYKsstN
# Jade 15.10.6 (2026-11-11, user): machine status and progress in the Jade overlay (platform.compat.jade).
deps.opt.jade=maven.modrinth:nvQzSEkH:eYz2YBGT
# spark (I27): profiler for the benchmark world.
deps.opt.spark=maven.modrinth:l6YH9Als:v5qtqRQi
# Apothic Attributes (I35 §七): its attribute panel shows the metabolism's modifiers; needs Placebo.
deps.opt.apothic=maven.modrinth:DGaH8Rh0:64fZbLnj
deps.opt.placebo=maven.modrinth:tCkE8p2N:B5zbSVlT
