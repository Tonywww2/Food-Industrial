# Node: Minecraft 26.1.2 / NeoForge (built with ModStitch + ModDevGradle, Java 25)
modstitch.platform=moddevgradle

deps.minecraft=26.1.2
deps.neoforge=26.1.2.109

# Metadata expanded into META-INF/neoforge.mods.toml and pack.mcmeta
vers.packFormat=64
vers.loaderRange=[1,)
vers.loaderDepRange=[26.1,)
vers.minecraftRange=[26.1-,26.2)

# JEI: compile against the API, run the full mod in dev
deps.jei=29.53.0.115

# Mods on the compile + dev runtime classpath (one coordinate per deps.mod.* key).
# Farmer's Delight, PneumaticCraft, CoFH Core and Thermal have no 26.1.2 release yet.
# Patchouli for 26.1 is only published as a Modrinth beta (no separate API jar). Pinned by Modrinth
# version id: the version number 26.1-94-beta also matches the Fabric file.
deps.mod.patchouli=maven.modrinth:patchouli:2CsnFLom

# Optional mods (I24, 2026-11-11): compiled against, in the dev runtime only with -PfiWith=<name>,… or all.
# AE2 26.1.13-beta: pattern providers on the machines; GuideME (26.1.14-beta, the lowest AE2 takes) is its required library.
deps.opt.ae2=maven.modrinth:XxWD5pD3:nVSxZcom
deps.opt.guideme=maven.modrinth:Ck4E7v7R:Vvte0XiA
# Jade 26.1.12 (2026-11-11, user): machine status and progress in the Jade overlay (platform.compat.jade).
deps.opt.jade=maven.modrinth:nvQzSEkH:Pr1h4azo
# spark (I27): profiler for the benchmark world.
deps.opt.spark=maven.modrinth:l6YH9Als:HwHxykP9
# Apothic Attributes (I35 §七): its attribute panel shows the metabolism's modifiers; needs Placebo.
deps.opt.apothic=maven.modrinth:DGaH8Rh0:lLLTcZXk
deps.opt.placebo=maven.modrinth:tCkE8p2N:c4uzJQYp
