# Node: Minecraft 26.1.2 / NeoForge (built with ModStitch + ModDevGradle, Java 25)
modstitch.platform=moddevgradle

deps.minecraft=26.1.2
deps.neoforge=26.1.2.109

# Metadata expanded into META-INF/neoforge.mods.toml and pack.mcmeta
vers.packFormat=64
vers.loaderRange=[1,)
vers.loaderDepRange=[26.1,)
vers.minecraftRange=[26.1-,26.2)

# JEI: compile against the API, run the full mod in dev
deps.jei=29.53.0.115

# Mods on the compile + dev runtime classpath (one coordinate per deps.mod.* key).
# Farmer's Delight, PneumaticCraft, CoFH Core and Thermal have no 26.1.2 release yet.
# Patchouli for 26.1 is only published as a Modrinth beta (no separate API jar). Pinned by Modrinth
# version id: the version number 26.1-94-beta also matches the Fabric file.
deps.mod.patchouli=maven.modrinth:patchouli:2CsnFLom
