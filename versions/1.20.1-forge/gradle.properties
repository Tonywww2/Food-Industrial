# Node: Minecraft 1.20.1 / Forge (default node, built with Architectury Loom)
loom.platform=forge

deps.minecraft=1.20.1
deps.forge=47.4.0

# Metadata expanded into META-INF/mods.toml and pack.mcmeta
vers.packFormat=15
vers.loaderRange=[47,)
vers.loaderDepRange=[47,)
vers.minecraftRange=[1.20.1,1.21)

# JEI: compile against the API, run the full mod in dev. 15.20+ has the recipe widgets, input handlers
# and slot display overrides of JEI 19+ (15.2 had none of them; I22). 15.35.0.175 is the last before
# 15.40 changed FluidHelper.getTooltip back to a List, which GTCEu 7.5.3's JEI mixin cannot target
# (2026-11-11, I26): packs with GTCEu run JEI 15.20–15.35, and this mod works on those and later.
deps.jei=15.35.0.175
# Patchouli: compile against the API, run the full mod in dev
deps.patchouli=1.20.1-84-FORGE

# Mods on the compile + dev runtime classpath (one coordinate per deps.mod.* key).
# Delete a key to drop that mod from this node only.
deps.mod.farmersdelight=curse.maven:farmers-delight-398521:6597298
deps.mod.cofhcore=curse.maven:cofh-core-69162:5374122
deps.mod.thermalfoundation=curse.maven:thermal-foundation-222880:5443583
deps.mod.thermalexpansion=curse.maven:thermal-expansion-69163:5372749
deps.mod.pneumaticcraft=curse.maven:pneumaticcraft-repressurized-281849:6142963

# Dev runtime only (2026-11-11, user): mods that fill material tags no other dependency fills, so the
# recipes using them show in JEI. Pam's HarvestCraft 2 Crops and Trees (pamhc2crops-1.20-1.0.3, pamhc2trees-1.20-1.0.2): corn, soybean, tea,
# grape, pineapple, papaya, citrus, cinnamon.
deps.dev.pamhc2crops=curse.maven:pams-harvestcraft-2-crops-361385:4687624
deps.dev.pamhc2trees=curse.maven:pams-harvestcraft-2-trees-365460:4625518

# Optional mods (I24–I27, 2026-11-11): compiled against, in the dev runtime only with -PfiWith=<name>,… or all.
# Create, Mekanism, NuclearCraft: I25 integration recipes; Create also the transmission interface.
deps.opt.create=maven.modrinth:LNytGWDc:8amzvn9x
deps.opt.mekanism=maven.modrinth:Ce6I4WUE:uxe1WQp4
deps.opt.nuclearcraft=maven.modrinth:Qvd8pl5G:djoqm7qe
# GTCEu 7.5.3 (I26): its materials fill the common tags of this mod's metals and chemicals.
deps.opt.gtceu=maven.modrinth:gregtechceu-modern:yLwvjuvy
# AE2 (I24): pattern providers on the machines; GuideME is its required library.
deps.opt.ae2=maven.modrinth:XxWD5pD3:QRpVsqDI
deps.opt.guideme=maven.modrinth:Ck4E7v7R:i7Tp1AHw
# Jade 11.12.3 (2026-11-11, user): machine status and progress in the Jade overlay (platform.compat.jade).
# 11.13.0+ shadows Font$StringRenderOutput's outer field by its SRG alias, which the Loom dev runtime names
# field_24240, so the dev client crashes; 11.12.3 has the same plugin API and players may run any 11.12+.
deps.opt.jade=maven.modrinth:nvQzSEkH:SOuuRR07
# spark (I27): profiler for the benchmark world.
deps.opt.spark=maven.modrinth:l6YH9Als:4FXHDE9F
# Apothic Attributes (I35 §七): its attribute panel shows the metabolism's modifiers; needs Placebo.
deps.opt.apothic=maven.modrinth:DGaH8Rh0:fwL9CWGd
deps.opt.placebo=maven.modrinth:tCkE8p2N:6SkuAGoz
