# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
# Configure only the projects a command needs. Commands for the NeoForge nodes then skip the
# 1.20.1-forge (Architectury Loom) project and never wait for Loom's configuration lock, which every
# Gradle process holds while it sets up that project. IDE imports still configure every node.
org.gradle.configureondemand=true

# Mod metadata (shared by every Stonecutter node)
mod.id=foodindustrial
mod.name=Food Industrial
mod.version=0.0.0
mod.group=com.tonywww.foodindustrial
mod.authors=Tonywww
mod.description=Lalala rila
mod.license=All Rights Reserved

# Optional mods (deps.opt.*) in every dev run; -PfiWith=<name>,… adds more, -PfiWithout=<name>,… leaves one out
# (Jade for testing, 2026-11-12, user).
fi.devWith=jade

# Unit tests (src/test/java, shared by every node; plain JUnit, no Minecraft bootstrap)
test.junit=5.11.4

# Node-specific values (Minecraft / loader versions, metadata ranges, dependencies)
# live in versions/<node>/gradle.properties.
