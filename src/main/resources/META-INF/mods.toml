# Forge metadata (1.20.1-forge node only). Placeholders are expanded per node from
# gradle.properties + versions/<node>/gradle.properties by processResources.
# NeoForge nodes ship META-INF/neoforge.mods.toml instead.
modLoader = "javafml"
loaderVersion = "${loaderRange}"
license = "${license}"
#issueTrackerURL = ""

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
#updateJSONURL = ""
#displayURL = ""
#logoFile = ""
#credits = ""
authors = "${authors}"
description = '''${description}'''

# Table names must use the literal mod id (Loom parses this file before expansion).
[[dependencies.foodindustrial]]
    modId = "forge"
    mandatory = true
    versionRange = "${loaderDepRange}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.foodindustrial]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraftRange}"
    ordering = "NONE"
    side = "BOTH"
